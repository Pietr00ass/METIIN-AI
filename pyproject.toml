[project]
name = "metiin-ai"
version = "0.1.0"
description = "Vision-based automation for the Metin2 game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "pyautogui==0.9.54",
    "PySide6==6.9.1",
    "easyocr==1.7.2",
    "ultralytics==8.3.186",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "Pillow==11.3.0",
    "pynput==1.8.1",
    "keyboard==0.13.5",
    "pywin32>=306; platform_system == 'Windows'",
    "pydantic==1.10.15",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
