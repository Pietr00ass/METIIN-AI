window:
  title_substr: "Metin2"

paths:
  templates_dir: "assets/templates"
  model: "runs/detect/train/weights/best.pt"
  log_dir: "logs"

controls:
  keys:
    forward: "w"
    left: "a"
    back: "s"
    right: "d"
    rotate: "e"
  key_repeat_ms: 60
  mouse_pause: 0.02
humanizer:
  pause_jitter: 0.05
  cursor_jitter: 2.0
  mouse_path_chance: 0.35
  mouse_path_steps: 18
  mouse_path_spread: 10.0
  mouse_path_progress_min: 0.9
  mouse_path_progress_max: 1.0
  click_miss_chance: 0.02
  click_miss_offset: 3.0
  loot_miss_chance: 0.04
  loot_miss_offset: 4.0
  micro_pause_chance: 0.2
  micro_pause_min: 0.01
  micro_pause_max: 0.04
detector:
  classes: ["metin","boss","mob_aggressive","mob_neutral","loot_label","ore","fish"]
  conf_thr: 0.5
  iou_thr: 0.45
  cv2_threads: null  # Set to an integer to override OpenCV's default thread count
  policy:
    deadzone_x: 0.05
    desired_box_w: 0.12

stuck:
  window: 0.8
  min_mag: 0.7
  recovery_action: rotate

scan:
  enabled: true
  period: 0.066
  key: "e"
  sweeps: 8
  sweep_ms: 250
  idle_sec: 0.0
  pause: 0.0

cooldowns:
  slot_min: 10

auto_press:
  enabled: false
  key: ""
  interval_sec: 1.0

buffs:
  - key: "f1"
    interval_sec: 60.0

priority: ["boss","metin","mob_aggressive","mob_neutral","ore","fish","loot_label"]

teleport:
  slots:
    - {page: "Strona I", slot: 1}
    - {page: "Strona I", slot: 2}
  no_target_sec: 10
  channel_every: 8

channels: [1,2,3,4,5,6,7,8]

channel:
  settle_sec: 5.0
  timeout_per_ch: 5.0
  hotkeys:
    1: numpad1
    2: numpad2
    3: numpad3
    4: numpad4
    5: numpad5
    6: numpad6
    7: numpad7
    8: numpad8

cycle:
  ch_from: 1
  ch_to: 8
  slots: [1,2,3,4,5,6,7,8]
  per_spot_sec: 90
  clear_sec: 6
  sequence: []

route:
  enabled: false
  path: ""
  coordinate_mode: "window"  # window = relative to game window, screen = absolute screen
  start_delay_sec: 0.0
  loop: false
  loop_pause_sec: 1.0

respawn:
  enabled: false
  source: "api"
  format: "json"
  respawn_url: ""
  cache_ttl_sec: 60
  cache_path: "data/respawn_cache.json"
  retry_attempts: 3
  retry_backoff_sec: 1.0

dungeon_fsm:
  initial_state: "floor_1"
  states:
    floor_1:
      ocr_triggers: ["dungeon finished", "no boss"]
      detect_triggers: ["boss"]
      timeout_sec: 120.0
      next_state: "floor_2"
      cooldown_sec: 3.0
      require_detections: []
      require_ocr_events: []
    floor_2:
      ocr_triggers: ["dungeon finished", "no boss"]
      detect_triggers: ["boss"]
      timeout_sec: 150.0
      next_state: "boss"
      cooldown_sec: 3.0
      require_detections: []
      require_ocr_events: []
    boss:
      ocr_triggers: ["dungeon finished"]
      detect_triggers: []
      timeout_sec: 180.0
      next_state: "reset"
      cooldown_sec: 5.0
      require_detections: []
      require_ocr_events: []
    reset:
      ocr_triggers: ["dungeon finished", "no boss", "death"]
      detect_triggers: []
      timeout_sec: 30.0
      next_state: "floor_1"
      cooldown_sec: 10.0
      require_detections: []
      require_ocr_events: []

potions:
  hp_key: "f2"
  hp_threshold: 40
  mp_key: "f3"
  mp_threshold: 30

ocr:
  hp_roi: [30, 30, 120, 18]
  mp_roi: [30, 50, 120, 18]
  inventory_roi: [720, 560, 120, 20]
  arrows_roi: [720, 530, 120, 20]

logging:
  level: INFO
  retention: "7 days"

notifications:
  telegram_token: ""
  telegram_chat_id: ""
  discord_webhook: ""
  include_screenshots: true
