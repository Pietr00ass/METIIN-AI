window:
  title_substr: "Metin2"
paths:
  templates_dir: "assets/templates"
  model: "runs/detect/train/weights/best.pt"
  log_dir: "logs"
controls:
  keys:
    forward: "w"
    left: "a"
    back: "s"
    right: "d"
    rotate: "e"
  key_repeat_ms: 60
  mouse_pause: 0.02
detector:
  classes: ["metin","boss","potwory"]
  conf_thr: 0.5
  iou_thr: 0.45
  policy:
    deadzone_x: 0.05
    desired_box_w: 0.12 # desired target width fraction (0.02-1.0)
stuck:
  window: 0.8
  min_mag: 0.7
  recovery_action: rotate
scan:
  period: 0.066
  key: "e"
  sweeps: 8
  sweep_ms: 250
@@ -39,25 +40,29 @@ auto_press:
buffs:
  - key: "f1"
    interval_sec: 60.0
priority: ["boss","metin","potwory"]
teleport:
  slots:
    - {page: "Strona I", slot: 1}
    - {page: "Strona I", slot: 2}
  no_target_sec: 10
  channel_every: 8
channels: [1,2,3,4,5,6,7,8]
channel:
  settle_sec: 5.0
  timeout_per_ch: 5.0
cycle:
  ch_from: 1
  ch_to: 8
  slots: [1,2,3,4,5,6,7,8]
  per_spot_sec: 90
  clear_sec: 6
  # opcjonalna pełna sekwencja (kanał i slot) zastępująca powyższe
  # zakresy.  Kolejne kroki mogą być podane dowolnej długości.
  # sequence:
  #   - {ch: 1, slot: 1}
  #   - {ch: 2, slot: 3}

logging:
  level: INFO
  retention: "7 days"
