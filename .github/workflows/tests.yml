name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pydantic pytest pytest-cov
      - run: pytest --cov=utils --cov-report=xml --cov-report=term --cov-fail-under=80
